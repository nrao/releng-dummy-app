name: Setup Python Environment
description: Install Python with pip caching and project dependencies
inputs:
  python-version:
    description: Python version to install
    default: "3.12"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    
    - name: Fix PATH for act (local actions testing)
      if: ${{ env.ACT }}
      shell: bash
      run: |
        ACT_TOOL_PATHS=$(cat /etc/environment | grep "PATH=" | sed -e 's/PATH=//' | tr ":" "\n" | grep "${ACT_TOOLSDIRECTORY}" | tr '\n' ':' | tr -d ':')
        echo ":${ACT_TOOL_PATHS}" >> "$GITHUB_PATH"
    
    - name: Upgrade pip
      shell: bash
      run: |
        python -m pip install --root-user-action=ignore --upgrade pip
