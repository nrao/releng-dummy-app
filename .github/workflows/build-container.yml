name: Build docker container
on:
  workflow_call:
    inputs:
      image_name:
        description: 'The full container image name'
        type: string
        required: true
      should_publish:
        description: 'Whether or not to publish the built image'
        type: boolean
        default: false
      app_version:
        description: 'The built app version'
        type: string
        required: true
      dockerfile:
        description: 'The dockerfile to build'
        type: string
        default: Dockerfile
    secrets:
      GHCR_TOKEN:
        description: GITHUB_TOKEN
        required: true
      NEXUS_USER:
        description: Nexus username to login with
        required: true
      NEXUS_PASSWORD:
        description: Nexus password to login with
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker app image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,enable=${{ github.event_name != 'pull_request' }}

      - name: Login to GitHub container registry
        if: ${{ inputs.should_publish && !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Login to Nexus
        if: ${{ inputs.should_publish }}
        uses: docker/login-action@v4
        with:
          registry: nrao.repo.sonatype.app
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry.localhost:5432"]
              http = true

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            VERSION=${{ inputs.app_version }}
          push: ${{ inputs.should_publish }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: "type=registry,ref=ghcr.io/nrao/releng/dummy_app:buildcache-${{ inputs.dockerfile }}"
          cache-to: "type=registry,ref=ghcr.io/nrao/releng/dummy_app:buildcache-${{ inputs.dockerfile }},mode=max"
