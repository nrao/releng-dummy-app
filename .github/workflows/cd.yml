name: CD
on:
  push:
    branches: [main]
    paths-ignore:
      - 'helm-dummyapp/**'

jobs:
  prep_env:
    uses: ./.github/workflows/prep-env.yml

  docker_cd_app:
    name : 'Build App container'
    needs: [prep_env]
    uses: ./.github/workflows/build-container.yml
    with:
      image_name: ${{ vars.APP_IMAGE_NAME }}
      should_publish: true
      app_version: ${{ needs.prep_env.outputs.app_version }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  docker_cd_test:
    name : 'Build Testing container'
    needs: [prep_env]
    uses: ./.github/workflows/build-container.yml
    with:
      image_name: ${{ vars.TEST_IMAGE_NAME }}
      should_publish: true
      app_version: ${{ needs.prep_env.outputs.app_version }}
      dockerfile: tester.dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  gitops_dev:
    name: Update dev GitOps environment
    if: ${{ !github.event.act }}
    runs-on: ubuntu-latest
    needs: [docker_cd_app, docker_cd_test]
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: nrao/releng-aws-gitops
          token: "${{ secrets.GH_REPO_PAT }}"
          path: ./gitops

      - name: Update dev environment image tag
        run: |
          cd gitops/
          imageTag="$(echo "${{ needs.docker_cd.outputs.image_tags }}" | grep 'sha-')"
          chmod +x ./scripts/setEnvTag.sh
          ./scripts/setEnvTag.sh dummy-app aws-dev "$imageTag"
          git config user.email "releng-cd@nrao.edu"
          git config user.name "CD Bot"
          git add .
          git commit -m "chore(dev): Set dummy-app/aws-dev image tag to $imageTag"
          git push origin main

  argocd_dev:
    if: ${{ !github.event.act }}
    needs: [gitops_dev]
    uses: ./.github/workflows/argo-check.yml
    with:
      app_name: dummy-app-dev
    secrets:
      server: ${{ secrets.ARGOCD_SERVER }}
      username: ${{ secrets.ARGOCD_USERNAME }}
      password: ${{ secrets.ARGOCD_PASSWORD }}

  gitops_qa:
    name: Promote to QA
    if: ${{ !github.event.act }}
    runs-on: ubuntu-latest
    needs: [argocd_dev]
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: nrao/releng-aws-gitops
          token: "${{ secrets.GH_REPO_PAT }}"
          path: ./gitops

      - name: Promote dev imageTag to QA
        run: |
          cd gitops/
          chmod +x ./scripts/promote.sh
          ./scripts/promote.sh dummy-app aws-dev aws-qa
          git config user.email "releng-cd@nrao.edu"
          git config user.name "CD Bot"
          git add .
          git commit -m "chore(qa): Promote dummy-app/aws-dev image to aws-qa"
          git push origin main

  argocd_qa:
    if: ${{ !github.event.act }}
    needs: [gitops_qa]
    uses: ./.github/workflows/argo-check.yml
    with:
      app_name: dummy-app-qa
    secrets:
      server: ${{ secrets.ARGOCD_SERVER }}
      username: ${{ secrets.ARGOCD_USERNAME }}
      password: ${{ secrets.ARGOCD_PASSWORD }}
