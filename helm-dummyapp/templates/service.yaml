{{- /*
When a Rollout is used, we need different Services (e.g. a Canary
Rollout needs a -stable and -canary service)
*/ -}}
{{- if not .Values.rollout.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dummyapp.fullname" . }}
  labels:
    {{- include "dummyapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dummyapp.selectorLabels" . | nindent 4 }}
{{- end }}
