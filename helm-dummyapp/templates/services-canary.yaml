{{- if .Values.rollout.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dummyapp.fullname" . }}-stable
  labels:
    {{- include "dummyapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dummyapp.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dummyapp.fullname" . }}-canary
  labels:
    {{- include "dummyapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dummyapp.selectorLabels" . | nindent 4 }}
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ include "dummyapp.fullname" . }}-traefik-service
  labels:
    {{- include "dummyapp.labels" . | nindent 4 }}
spec:
  weighted:
    services:
      - name: {{ include "dummyapp.fullname" . }}-stable
        port: http
      - name: {{ include "dummyapp.fullname" . }}-canary
        port: http
{{- end }}
